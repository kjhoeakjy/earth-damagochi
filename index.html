<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나비야 나비야</title>
<meta name="description" content="지금 위성 태그로 추적 중인 동물 한 마리를 입양해, 태그가 보내는 실제 위치를 따라가요.">
<meta name="theme-color" content="#03050a">
<meta property="og:title" content="나비야 나비야">
<meta property="og:description" content="지금 추적 중인 동물로 만든 다마고치">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M19.2 19.6C15 8.6 5.6 5.4 3.6 10.6 2 15.4 8.4 19.8 19.2 20.4zM19.2 21.2c-7 .4-12.6 3.8-10.4 8.6 2.4 4.4 8.6.2 10.4-7.6zM20.8 19.6C25 8.6 34.4 5.4 36.4 10.6c1.6 4.8-4.8 9.2-15.6 9.8zM20.8 21.2c7 .4 12.6 3.8 10.4 8.6-2.4 4.4-8.6.2-10.4-7.6z' fill='%23f5a65b' stroke='%2324150a' stroke-width='1.2'/%3E%3Cpath d='M20 12.6c1.1 3.4 1.1 13.6 0 16.8-1.1-3.2-1.1-13.4 0-16.8z' fill='%23eef2f8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Diphylleia&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-mode="browse">
<div id="stage">
  <canvas id="globe" aria-label="3D 지구. 끌어서 돌리고, 휠이나 두 손가락으로 확대해요."></canvas>
  <div id="labels" aria-hidden="true"></div>
</div>

<div id="loading" role="status">
  <div class="ld">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <g class="wing l"><path d="M23 25C17 12 6 9 5 16c-1 6 7 10 18 10z" fill="#f5a65b" stroke="#2a1708" stroke-width="1.4"/><path d="M23 27c-8 0-14 4-11 10 3 5 10-1 11-9z" fill="#e8893d" stroke="#2a1708" stroke-width="1.4"/></g>
      <g class="wing r"><path d="M25 25c6-13 17-16 18-9 1 6-7 10-18 10z" fill="#f5a65b" stroke="#2a1708" stroke-width="1.4"/><path d="M25 27c8 0 14 4 11 10-3 5-10-1-11-9z" fill="#e8893d" stroke="#2a1708" stroke-width="1.4"/></g>
      <path d="M24 17c1.2 3 1.2 13 0 17-1.2-4-1.2-14 0-17z" fill="#eef2f8"/>
    </svg>
    <span id="ldMsg">불러오는 중…</span>
  </div>
</div>

<div id="ui">
  <header class="brand">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <defs>
        <radialGradient id="mkw" cx="35%" cy="35%" r="85%"><stop offset="0" stop-color="#ffd8ac"/><stop offset=".55" stop-color="#f5a65b"/><stop offset="1" stop-color="#b85d1f"/></radialGradient>
      </defs>
      <g class="w wl">
        <path d="M19.2 19.6C15 8.6 5.6 5.4 3.6 10.6 2 15.4 8.4 19.8 19.2 20.4z" fill="url(#mkw)" stroke="#24150a" stroke-width="1.15"/>
        <path d="M19.2 21.2c-7 .4-12.6 3.8-10.4 8.6 2.4 4.4 8.6.2 10.4-7.6z" fill="url(#mkw)" stroke="#24150a" stroke-width="1.15"/>
        <circle cx="5.6" cy="11.4" r=".8" fill="#fff"/><circle cx="7.6" cy="9" r=".6" fill="#fff"/><circle cx="10.6" cy="29.6" r=".6" fill="#fff"/>
      </g>
      <g transform="matrix(-1 0 0 1 40 0)">
        <g class="w wr">
          <path d="M19.2 19.6C15 8.6 5.6 5.4 3.6 10.6 2 15.4 8.4 19.8 19.2 20.4z" fill="url(#mkw)" stroke="#24150a" stroke-width="1.15"/>
          <path d="M19.2 21.2c-7 .4-12.6 3.8-10.4 8.6 2.4 4.4 8.6.2 10.4-7.6z" fill="url(#mkw)" stroke="#24150a" stroke-width="1.15"/>
          <circle cx="5.6" cy="11.4" r=".8" fill="#fff"/><circle cx="7.6" cy="9" r=".6" fill="#fff"/><circle cx="10.6" cy="29.6" r=".6" fill="#fff"/>
        </g>
      </g>
      <path d="M20 12.6c1.1 3.4 1.1 13.6 0 16.8-1.1-3.2-1.1-13.4 0-16.8z" fill="#eef2f8"/>
      <path d="M20 13c-.6-2.6-2.4-4.6-4.2-5.6M20 13c.6-2.6 2.4-4.6 4.2-5.6" stroke="#eef2f8" stroke-width=".9" fill="none" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>나비야 나비야</h1>
      <p>지금 추적 중인 동물로 만든 다마고치</p>
    </div>
  </header>

  <div class="topbar">
    <div class="clock" id="clock"></div>
    <button class="btn small" id="btnMode" type="button" hidden></button>
  </div>

  <aside class="left">
    <section id="picker" class="panel" aria-labelledby="pickTitle">
      <div class="head">
        <h2 id="pickTitle">동물 고르기</h2>
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
          <input id="q" type="search" placeholder="종, 장소, 태그 번호" autocomplete="off" aria-label="검색">
        </label>
        <div class="filters" id="filters">
          <div class="frow"><span>종</span><div class="chips" data-f="sp"></div></div>
          <div class="frow"><span>지역</span><div class="chips" data-f="now"></div></div>
        </div>
        <div class="sortrow">
          <span id="count" class="num"></span>
          <select id="sort" aria-label="정렬">
            <option value="recent">최근 신호순</option>
            <option value="km">이동 거리순</option>
            <option value="days">추적 기간순</option>
          </select>
        </div>
      </div>
      <div id="list" class="scroll" role="listbox" aria-label="입양할 수 있는 동물"></div>
    </section>

    <section id="pet" class="panel scroll" aria-label="입양한 동물" hidden>
      <div class="chips" id="petSwitch"></div>
      <figure class="petphoto" id="petPhoto"></figure>
      <div class="petname">
        <h2 id="petName"></h2>
        <div class="sub" id="petSub"></div>
      </div>
      <div class="status"><span class="live" id="liveDot"></span><span id="petStatus"></span></div>
      <div class="sigline" id="petSig"></div>
      <div class="stats" id="petStats"></div>
      <div class="others" id="petOthers"></div>
    </section>
  </aside>

  <aside class="right">
    <section id="detail" class="panel" aria-label="동물 정보">
      <div class="scroll" id="detailBody"></div>
      <div class="foot" id="detailFoot" hidden></div>
    </section>

    <section id="journal" class="panel" aria-label="기록" hidden>
      <div class="tabs" role="tablist" aria-label="기록">
        <button class="tab" role="tab" data-tab="day" aria-selected="true" type="button">오늘</button>
        <button class="tab" role="tab" data-tab="trip" aria-selected="false" type="button">여정</button>
        <button class="tab" role="tab" data-tab="info" aria-selected="false" type="button">정보</button>
      </div>
      <div class="tabpanel scroll" id="tabBody" role="tabpanel"></div>
    </section>
  </aside>

  <div class="bottom">
    <div id="timeline" class="panel" hidden>
      <button class="iconbtn" id="tlPrev" type="button" aria-label="이전 날">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m14.5 6-6 6 6 6"/></svg></button>
      <div class="days scroll" id="tlDays" role="list" aria-label="날짜별 기록"></div>
      <button class="iconbtn" id="tlNext" type="button" aria-label="다음 날">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9.5 6 6 6-6 6"/></svg></button>
      <div class="tl-label" id="tlLabel"></div>
    </div>
    <div id="replay" class="panel" hidden>
      <div class="rp-text"><span class="rp-what" id="rpWhat"></span><b id="rpDate"></b><span class="rp-where" id="rpWhere"></span></div>
      <div class="rp-km" id="rpKm"></div>
      <button class="btn small" id="rpSkip" type="button">건너뛰기</button>
      <div class="rp-bar" aria-hidden="true"><i id="rpBar"></i></div>
    </div>
  </div>
</div>

<div class="mapctl" id="mapctl">
  <button class="iconbtn" id="cFollow" type="button" aria-pressed="true" aria-label="따라가기" title="따라가기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <button class="iconbtn" id="cIn" type="button" aria-label="가까이 보기" title="가까이">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="iconbtn" id="cOut" type="button" aria-label="멀리 보기" title="멀리">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  <button class="iconbtn" id="cHome" type="button" aria-label="지구 전체 보기" title="지구 전체">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3z"/></svg></button>
</div>

<div class="modal" id="mAdopt" hidden>
  <div class="sheet panel" role="dialog" aria-modal="true" aria-labelledby="adTitle" id="adSheet"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="js/core.js"></script>
<script src="js/globe.js"></script>
<script src="js/story.js"></script>
<script src="js/app.js"></script>
</body>
</html>
